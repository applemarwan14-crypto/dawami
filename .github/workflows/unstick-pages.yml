# يلغي نشر GitHub Pages العالق ثم يطلق نشرًا جديدًا. تشغيل يدوي من تبويب Actions عند الحاجة.
name: unstick pages
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/unstick-pages.yml']
permissions:
  pages: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel stuck deployment
        run: |
          for id in 47c883156b982c7ded03e304600e7202f8d8dbc8 59ceb45edc7fa9e6e1590dfc838c59ebb45a7691; do
            echo "== $id before:"; gh api repos/${{ github.repository }}/pages/deployments/$id || true
            gh api -X POST repos/${{ github.repository }}/pages/deployments/$id/cancel -i 2>&1 | head -1 || true
            echo "== $id after:"; gh api repos/${{ github.repository }}/pages/deployments/$id || true
          done
          gh api repos/${{ github.repository }}/pages || true
      - name: Request new Pages build
        run: |
          sleep 15
          gh api -X POST repos/${{ github.repository }}/pages/builds && echo "build requested" || echo "build request failed"
