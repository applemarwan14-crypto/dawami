# إذا علق نشر GitHub Pages ("in progress deployment"): Actions ← unstick pages ← Run workflow
# والصق رقم الـ commit العالق كما يظهر في رسالة الخطأ.
name: unstick pages
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'رقم الـ commit العالق (كامل)'
        required: true
permissions:
  pages: write
  contents: read
jobs:
  unstick:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel stuck deployment and request a new build
        run: |
          gh api -X POST repos/${{ github.repository }}/pages/deployments/${{ inputs.sha }}/cancel || true
          gh api repos/${{ github.repository }}/pages/deployments/${{ inputs.sha }} || true
          sleep 15
          gh api -X POST repos/${{ github.repository }}/pages/builds
